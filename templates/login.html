{% extends 'base.html' %}

{% block title %}Iniciar Sesión{% endblock %}

{% block content %}
<div class="auth-header">
    <h1>Iniciar Sesión</h1>
    <p>Accede de forma segura a tu cuenta</p>
</div>

<form action="{{ url_for('login') }}" method="POST" autocomplete="off">
    <!-- Username Field -->
    <div class="form-group">
        <input type="text" id="username" name="username" class="form-control" placeholder=" " required value="{{ username or '' }}">
        <label for="username">Usuario</label>
    </div>

    <!-- Password Field -->
    <div class="form-group">
        <input type="password" id="password" name="password" class="form-control" placeholder=" " required>
        <label for="password">Contraseña</label>
    </div>

    <!-- Submit Button -->
    <button type="submit" class="btn-primary">
        Ingresar <span>🚀</span>
    </button>
</form>

<div style="margin-top: 2rem; text-align: center; font-size: 0.85rem; color: var(--text-muted);">
    <p>Cuentas de demostración disponibles:</p>
    <div style="background: rgba(255, 255, 255, 0.03); border: 1px dashed rgba(255, 255, 255, 0.08); border-radius: var(--border-radius-md); padding: 0.75rem; margin-top: 0.5rem; display: inline-block; text-align: left;">
        <code>admin</code> / <code>password123</code><br>
        <code>usuario</code> / <code>demo2026</code>
    </div>
</div>
{% endblock %}
